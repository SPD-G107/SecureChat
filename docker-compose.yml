version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: securechat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-securechat}
      MYSQL_USER: ${DB_USER:-securechat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-securechat_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - securechat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securechat-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-securechat_user}
      DB_PASSWORD: ${DB_PASSWORD:-securechat_pass_2026}
      DB_NAME: ${DB_NAME:-securechat}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026}
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - securechat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechat-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - securechat-network

volumes:
  mysqldata:

networks:
  securechat-network:
    driver: bridge
