version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: securechat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-securechat}
      MYSQL_USER: ${DB_USER:-securechat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-securechat_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - securechat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securechat-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-securechat_user}
      DB_PASSWORD: ${DB_PASSWORD:-securechat_pass_2026}
      DB_NAME: ${DB_NAME:-securechat}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-adminSecureChat}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://18-140-114-212.sslip.io}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - securechat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechat-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - securechat-network

  coturn:
    image: coturn/coturn:latest
    container_name: securechat-coturn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49160:49152-49160/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=18-140-114-212.sslip.io
      - --user=securechat:securechat_turn_2026
      - --external-ip=18.140.114.212
    networks:
      - securechat-network

volumes:
  mysqldata:

networks:
  securechat-network:
    driver: bridge
